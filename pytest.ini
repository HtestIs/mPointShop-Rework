[pytest]
python_files = test_*.py
python_classes = Tests
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    ; --html=reports/report.html
    ; --self-contained-html
    ; --alluredir=allure-results
markers =
    smoke: critical functionality
    regression: full regression tests
    slow: long running tests