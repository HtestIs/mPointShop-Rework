[pytest]
python_files = test_*.py
python_classes = Tests
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not defect and not oopsie and not mpointapp"
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
markers =
    smoke: critical functionality
    regression: full regression tests
    slow: long running tests
    search: tests related to search functionality
    registration: tests related to store registration
    security: tests related to security features
    e2e: end-to-end tests
    api: tests related to API endpoints
    mpointshop: tests for the mPointShop system
    mexchange: tests for the mExchange system
    mshopadmin: tests for the mShopAdmin / AAP system
    mpointapp: tests for the mPointApp mobile system
    ongoing: tests that are currently being developed or fixed
    defect: known failing tests tracked as defects
    oopsie: error tests only, not related to product defects
    fixthisdumdum: could be flaky, needs to be fixed, or is testing a known issue