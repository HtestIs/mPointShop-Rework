name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      ENV: dev

      # mPointShop
      DEV_WEB_BASE_URL: ${{ secrets.DEV_WEB_BASE_URL }}
      DEV_API_BASE_URL: ${{ secrets.DEV_API_BASE_URL }}
      DEV_PARTNER_USERNAME: ${{ secrets.DEV_PARTNER_USERNAME }}
      DEV_PARTNER_PASSWORD: ${{ secrets.DEV_PARTNER_PASSWORD }}
      DEV_MERCHANT_USERNAME: ${{ secrets.DEV_MERCHANT_USERNAME }}
      DEV_MERCHANT_PASSWORD: ${{ secrets.DEV_MERCHANT_PASSWORD }}
      DEV_DUP_USERNAME: ${{ secrets.DEV_DUP_USERNAME }}

      # mExchange
      DEV_MEXCHANGE_WEB_URL: ${{ secrets.DEV_MEXCHANGE_WEB_URL }}
      DEV_MEXCHANGE_API_URL: ${{ secrets.DEV_MEXCHANGE_API_URL }}
      DEV_MEXCHANGE_USERNAME: ${{ secrets.DEV_MEXCHANGE_USERNAME }}
      DEV_MEXCHANGE_PASSWORD: ${{ secrets.DEV_MEXCHANGE_PASSWORD }}

      # mShopAdmin
      DEV_AAP_BASE_URL: ${{ secrets.DEV_AAP_BASE_URL }}
      DEV_AAP_USERNAME: ${{ secrets.DEV_AAP_USERNAME }}
      DEV_AAP_PASSWORD: ${{ secrets.DEV_AAP_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -m "not defect and not oopsie" --env=dev --browser=chrome --headless -q

      - name: Upload pytest / html / allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/
            allure-results/